<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPACE APP — 今日の宇宙の一枚</title>
  <meta name="description" content="NASA の Astronomy Picture of the Day（APOD）を、1995年から今日まで日付を選んで眺められる天体写真ビューア。">
  <meta name="theme-color" content="#04050d">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SPACE APP">
  <meta property="og:title" content="SPACE APP — 今日の宇宙の一枚">
  <meta property="og:description" content="NASA の Astronomy Picture of the Day を、1995年から今日まで日付を選んで眺められる天体写真ビューア。">
  <meta property="og:url" content="https://space-app.stsh.workers.dev/">
  <meta property="og:image" content="https://assets.science.nasa.gov/content/dam/science/cds/apod/apod/2015/july/PlutoCharon01_NewHorizons_1422.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="SPACE APP — 今日の宇宙の一枚">
  <meta name="twitter:description" content="NASA の Astronomy Picture of the Day を、1995年から今日まで日付を選んで眺められる天体写真ビューア。">
  <meta name="twitter:image" content="https://assets.science.nasa.gov/content/dam/science/cds/apod/apod/2015/july/PlutoCharon01_NewHorizons_1422.jpg">

  <script type="module" src="/js/main.js"></script>
</head>

<body>
  <a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-50 btn btn-primary">本文へスキップ</a>

  <header class="sticky top-0 z-30 border-b border-white/5 bg-space-950/70 backdrop-blur-lg">
    <div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-3 sm:px-6">
      <a href="/" class="flex items-center gap-2.5" data-nav="today">
        <img src="/favicon.svg" alt="" class="size-8" width="32" height="32">
        <span class="text-lg font-bold tracking-[0.18em]">SPACE APP</span>
      </a>
      <nav aria-label="表示の切り替え" class="flex items-center gap-1 rounded-full border border-white/10 bg-white/5 p-1">
        <a href="/" class="tab" data-nav="today">一枚</a>
        <a href="/?view=gallery" class="tab" data-nav="gallery">ギャラリー</a>
      </nav>
    </div>
  </header>

  <main id="main" class="mx-auto max-w-6xl px-4 pt-8 pb-20 sm:px-6">
    <p id="status" class="sr-only" aria-live="polite"></p>

    <!-- 一枚ビュー -->
    <section id="today-view" aria-labelledby="today-heading">
      <div class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <p class="meta-label">Astronomy Picture of the Day</p>
          <h1 id="today-heading" class="mt-2 text-3xl font-bold tracking-tight sm:text-4xl">今日の宇宙の一枚</h1>
        </div>
        <form id="date-form" class="flex flex-wrap items-center gap-2" novalidate>
          <button type="button" id="prev-day" class="btn btn-icon" aria-label="前の日">
            <span aria-hidden="true">←</span>
          </button>
          <label class="sr-only" for="date-input">日付を選ぶ</label>
          <input id="date-input" type="date" min="1995-06-16" class="rounded-full border border-white/15 bg-white/5 px-4 py-2 text-sm text-star [color-scheme:dark]">
          <button type="button" id="next-day" class="btn btn-icon" aria-label="次の日">
            <span aria-hidden="true">→</span>
          </button>
          <button type="button" id="latest-day" class="btn">最新</button>
          <button type="button" id="random-day" class="btn btn-primary">ランダムな日</button>
        </form>
      </div>

      <article id="apod-detail" class="panel overflow-hidden" aria-busy="true"></article>
      <p class="mt-3 text-center text-xs text-star/40">キーボードの ← → で前後の日に移動できます</p>
    </section>

    <!-- ギャラリービュー -->
    <section id="gallery-view" aria-labelledby="gallery-heading" hidden>
      <div class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <p class="meta-label">Random 8 from 30 years</p>
          <h1 id="gallery-heading" class="mt-2 text-3xl font-bold tracking-tight sm:text-4xl">30年分からランダムに8枚</h1>
        </div>
        <button type="button" id="shuffle" class="btn btn-primary">別の8枚を見る</button>
      </div>
      <div id="gallery" class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-4" aria-busy="true"></div>
    </section>
  </main>

  <dialog id="detail-dialog" class="m-auto w-[min(64rem,calc(100%-2rem))] max-h-[calc(100dvh-2rem)] overflow-y-auto rounded-2xl border border-white/10 bg-space-900 p-0 text-star shadow-2xl" aria-labelledby="dialog-title">
    <div class="sticky top-0 z-10 flex justify-end bg-gradient-to-b from-space-900 to-transparent p-3">
      <button type="button" id="dialog-close" class="btn btn-icon" aria-label="閉じる">
        <span aria-hidden="true">✕</span>
      </button>
    </div>
    <div id="dialog-body" class="-mt-14"></div>
  </dialog>

  <footer class="border-t border-white/5">
    <div class="mx-auto flex max-w-6xl flex-col gap-2 px-4 py-8 text-xs text-star/50 sm:flex-row sm:items-center sm:justify-between sm:px-6">
      <p>
        写真と解説：<a class="underline decoration-white/30 underline-offset-4 hover:text-star" href="https://science.nasa.gov/apod/" target="_blank" rel="noopener noreferrer">NASA Astronomy Picture of the Day</a>
        ／ 著作権表示のある写真は各撮影者に帰属します
      </p>
      <a class="underline decoration-white/30 underline-offset-4 hover:text-star" href="https://github.com/stshf/space-app" target="_blank" rel="noopener noreferrer">GitHub</a>
    </div>
  </footer>
</body>
</html>
